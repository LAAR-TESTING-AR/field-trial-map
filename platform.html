<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Field Trial Platform</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7f6;
}

header{
  position:relative;
  overflow:hidden;
  min-height:150px;
  padding:24px 20px;
  color:white;
  background:
    linear-gradient(
      110deg,
      #064526 0%,
      #0b6b3a 48%,
      #087343 100%
    );
}

/* Surcos diagonales minimalistas */
header::before{
  content:"";
  position:absolute;
  inset:-80px -40px;
  background:
    repeating-linear-gradient(
      118deg,
      transparent 0,
      transparent 23px,
      rgba(255,255,255,0.055) 24px,
      rgba(255,255,255,0.055) 26px,
      transparent 27px,
      transparent 48px
    );
  transform:perspective(500px) rotateX(18deg);
  transform-origin:center bottom;
  pointer-events:none;
}

/* Luz suave detrás del logo */
header::after{
  content:"";
  position:absolute;
  left:calc(50% - 630px);
  top:50%;
  width:210px;
  height:210px;
  transform:translateY(-50%);
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      rgba(139,195,74,0.20) 0%,
      rgba(139,195,74,0.07) 45%,
      transparent 72%
    );
  pointer-events:none;
}

.header-container{
  position:relative;
  z-index:1;
  max-width:1200px;
  min-height:102px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:24px;
}

.logo{
  width:88px;
  height:88px;
  flex-shrink:0;
  object-fit:cover;
  border-radius:18px;
  border:1px solid rgba(255,255,255,0.32);
  box-shadow:
    0 10px 25px rgba(0,0,0,0.22),
    0 0 0 6px rgba(255,255,255,0.06);
}

.header-container h1{
  margin:0;
  font-size:clamp(30px,4vw,44px);
  line-height:1.05;
  letter-spacing:-1px;
}

.subtitulo{
  margin-top:8px;
  font-size:17px;
  font-weight:500;
  letter-spacing:0.4px;
  color:rgba(255,255,255,0.88);
}

h1{
  margin:0;
}

.subtitulo{
  margin-top:5px;
}

main{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.modulos{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:25px;
}

.card{
  background:white;
  border-radius:16px;
  padding:25px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.card h2{
  color:#0b6b3a;
}

.icono{
  font-size:48px;
}

.boton{
  display:inline-block;
  margin-top:20px;
  padding:12px 20px;
  background:#0b6b3a;
  color:white;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
}

.disabled{
  background:#999;
  pointer-events:none;
}

@media(max-width:700px){

  header{
    min-height:190px;
    padding:24px 18px;
  }

  .header-container{
    flex-direction:column;
    justify-content:center;
    text-align:center;
    gap:14px;
  }

  .logo{
    width:78px;
    height:78px;
  }

  h1{
    font-size:30px;
  }

  .subtitulo{
    font-size:15px;
  }

}

</style>

</head>

<body>

<header>

  <div class="header-container">

    <img
src="icon-192.png"
alt="Field Trial Platform"
class="logo">

    <div>

      <h1>Field Trial Platform</h1>

      <div class="subtitulo">
        Argentina 2026-27
      </div>

    </div>

  </div>

</header>

<main>

  <div class="modulos">

    <div class="card">

      <div class="icono">🗺️</div>

      <h2>Master List</h2>

      <p>
        AOI, Trials, Access, Photos y Navigation.
      </p>

      <a
        class="boton"
        href="index.html">
        Open Module
      </a>

    </div>

    <div class="card">

      <div class="icono">🌱</div>

      <h2>Sowing</h2>

      <p>
        Planting Tracker, KPIs, Timeline y Dashboard.
      </p>

     <a
  class="boton"
  href="planting/">
  Open Module
</a>

    </div>

    <div class="card">

      <div class="icono">🌾</div>

      <h2>Harvesting</h2>

      <p>
        Future module.
      </p>

      <a
class="boton disabled"
href="#">
Coming Soon
</a>

    </div>

  </div>

</main>

</body>
</html>
