<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Field Trial Platform</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7f6;
}

header{
  position:relative;
  overflow:hidden;
  min-height:150px;
  padding:24px 20px;
  color:white;
  background:
    linear-gradient(
      110deg,
      #064526 0%,
      #0b6b3a 48%,
      #087343 100%
    );
}

/* Surcos diagonales minimalistas */
header::before{
  content:"";
  position:absolute;
  inset:-80px -40px;
  background:
    repeating-linear-gradient(
      118deg,
      transparent 0,
      transparent 23px,
      rgba(255,255,255,0.055) 24px,
      rgba(255,255,255,0.055) 26px,
      transparent 27px,
      transparent 48px
    );
  transform:perspective(500px) rotateX(18deg);
  transform-origin:center bottom;
  pointer-events:none;
}

/* Luz suave detrás del logo */
header::after{
  content:"";
  position:absolute;
  left:calc(50% - 630px);
  top:50%;
  width:210px;
  height:210px;
  transform:translateY(-50%);
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      rgba(139,195,74,0.20) 0%,
      rgba(139,195,74,0.07) 45%,
      transparent 72%
    );
  pointer-events:none;
}

.header-container{
  position:relative;
  z-index:1;
  max-width:1200px;
  min-height:102px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:24px;
}

.logo{
  width:88px;
  height:88px;
  flex-shrink:0;
  object-fit:cover;
  border-radius:18px;
  border:1px solid rgba(255,255,255,0.32);
  box-shadow:
    0 10px 25px rgba(0,0,0,0.22),
    0 0 0 6px rgba(255,255,255,0.06);
}

.header-container h1{
  margin:0;
  font-size:clamp(30px,4vw,44px);
  line-height:1.05;
  letter-spacing:-1px;
}

.subtitulo{
  margin-top:8px;
  font-size:17px;
  font-weight:500;
  letter-spacing:0.4px;
  color:rgba(255,255,255,0.88);
}

h1{
  margin:0;
}

.subtitulo{
  margin-top:5px;
}

main{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.modulos{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:25px;
}

.card{
  --modulo-color:#0b6b3a;
  position:relative;
  display:flex;
  flex-direction:column;
  min-height:310px;
  overflow:hidden;
  padding:30px;
  background:
    linear-gradient(
      145deg,
      #ffffff 0%,
      #f7faf8 100%
    );
  border:1px solid rgba(11,107,58,0.18);
  border-top:6px solid var(--modulo-color);
  border-radius:20px;
  box-shadow:
    0 12px 30px rgba(16,65,40,0.10),
    0 2px 8px rgba(16,65,40,0.08);
  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
}

.card:nth-child(1){
  --modulo-color:#075c34;
}

.card:nth-child(2){
  --modulo-color:#69a928;
}

.card:nth-child(3){
  --modulo-color:#c89419;
}

.card::before{
  content:"";
  position:absolute;
  right:-55px;
  bottom:-70px;
  width:190px;
  height:190px;
  border:35px solid var(--modulo-color);
  border-radius:50%;
  opacity:.045;
  pointer-events:none;
}

.card::after{
  content:"";
  position:absolute;
  right:24px;
  top:28px;
  width:52px;
  height:2px;
  background:var(--modulo-color);
  box-shadow:
    0 8px 0 var(--modulo-color),
    0 16px 0 var(--modulo-color);
  opacity:.18;
  transform:rotate(-18deg);
  pointer-events:none;
}

.card:hover{
  transform:translateY(-7px);
  border-color:var(--modulo-color);
  box-shadow:
    0 20px 40px rgba(16,65,40,0.16),
    0 4px 10px rgba(16,65,40,0.10);
}

.card h2{
  position:relative;
  margin:20px 0 10px;
  color:#123d29;
  font-size:27px;
  line-height:1.1;
}

.card p{
  position:relative;
  flex:1;
  margin:0;
  color:#4c5d53;
  font-size:16px;
  line-height:1.55;
}

.icono{
  position:relative;
  width:70px;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  border-radius:18px;
  background:var(--modulo-color);
  box-shadow:
    0 9px 18px rgba(11,107,58,0.18),
    inset 0 1px 0 rgba(255,255,255,0.28);
}

/* Icono Master List: capas de información */
.icono-master{
  flex-direction:column;
  gap:7px;
}

.icono-linea{
  display:block;
  width:34px;
  height:6px;
  border:2px solid white;
  border-radius:6px;
  transform:skewX(-18deg);
}

.icono-linea:nth-child(2){
  margin-left:8px;
}

/* Icono Sowing: brote minimalista */
.tallo{
  position:absolute;
  bottom:15px;
  left:34px;
  width:4px;
  height:31px;
  background:white;
  border-radius:5px;
}

.hoja{
  position:absolute;
  width:21px;
  height:12px;
  background:white;
}

.hoja-izquierda{
  left:15px;
  top:23px;
  border-radius:18px 3px 18px 3px;
  transform:rotate(24deg);
}

.hoja-derecha{
  right:14px;
  top:17px;
  border-radius:3px 18px 3px 18px;
  transform:rotate(-22deg);
}

/* Icono Harvesting: espiga minimalista */
.espiga-tallo{
  position:absolute;
  bottom:13px;
  left:34px;
  width:4px;
  height:43px;
  background:white;
  border-radius:4px;
}

.grano{
  position:absolute;
  width:15px;
  height:8px;
  background:white;
}

.grano-1{
  left:20px;
  top:20px;
  border-radius:14px 2px 14px 2px;
  transform:rotate(25deg);
}

.grano-2{
  right:18px;
  top:27px;
  border-radius:2px 14px 2px 14px;
  transform:rotate(-25deg);
}

.grano-3{
  left:20px;
  top:36px;
  border-radius:14px 2px 14px 2px;
  transform:rotate(25deg);
}

.grano-4{
  right:18px;
  top:43px;
  border-radius:2px 14px 2px 14px;
  transform:rotate(-25deg);
}

.boton{
  position:relative;
  align-self:flex-start;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:46px;
  margin-top:25px;
  padding:12px 22px;
  border:1px solid var(--modulo-color);
  border-radius:12px;
  background:var(--modulo-color);
  color:white;
  text-decoration:none;
  font-weight:700;
  box-shadow:0 7px 14px rgba(11,107,58,0.16);
  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.boton:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 20px rgba(11,107,58,0.23);
}

.disabled{
  background:#e7e9e8;
  border-color:#d2d6d4;
  color:#758079;
  box-shadow:none;
  pointer-events:none;
}

.boton{
  display:inline-block;
  margin-top:20px;
  padding:12px 20px;
  background:#0b6b3a;
  color:white;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
}

.disabled{
  background:#999;
  pointer-events:none;
}
.kpi-dashboard{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(180px,1fr)
    );

  gap:18px;

  margin-bottom:30px;
}

.kpi-card{

  background:white;

  border-radius:18px;

  padding:22px;

  text-align:center;

  border-top:5px solid #0b6b3a;

  box-shadow:
    0 8px 18px rgba(0,0,0,.08);
}

.kpi-valor{

  display:block;

  font-size:34px;

  font-weight:700;

  color:#0b6b3a;
}

.kpi-label{

  display:block;

  margin-top:6px;

  color:#666;

  font-size:14px;

  letter-spacing:.5px;

  text-transform:uppercase;
}

  .mini-kpi{
  margin-top:15px;
}

.mini-kpi-valor{
  font-size:26px;
  font-weight:700;
  color:#69a928;
}

.mini-kpi-label{
  color:#666;
  font-size:13px;
}

.mini-progress{
  margin-top:10px;
  width:100%;
  height:8px;
  border-radius:20px;
  background:#e5e5e5;
  overflow:hidden;
}

.mini-progress-fill{
  height:100%;
  background:#69a928;
  border-radius:20px;
}
  
@media(max-width:700px){

  header{
    min-height:190px;
    padding:24px 18px;
  }

  .header-container{
    flex-direction:column;
    justify-content:center;
    text-align:center;
    gap:14px;
  }

  .logo{
    width:78px;
    height:78px;
  }

  h1{
    font-size:30px;
  }

  .subtitulo{
    font-size:15px;
  }
  main{
    padding:28px 16px;
  }

  .modulos{
    grid-template-columns:1fr;
    gap:20px;
  }

  .card{
    min-height:285px;
    padding:25px;
    border-radius:18px;
  }

  .icono{
    width:64px;
    height:64px;
    border-radius:16px;
  }

  .card h2{
    margin-top:18px;
    font-size:30px;
  }

  .card p{
    font-size:17px;
  }

  .boton{
    width:100%;
    min-height:52px;
    font-size:17px;
  }
    .kpi-dashboard{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:20px;
  }

  .kpi-card{
    padding:10px;
    border-radius:14px;
  }

  .kpi-valor{
    font-size:24px;
  }

  .kpi-label{
    font-size:12px;
  }
}

</style>

</head>

<body>

<header>

  <div class="header-container">

    <img
src="icon-192.png"
alt="Field Trial Platform"
class="logo">

    <div>

      <h1>Field Trial Platform</h1>

      <div class="subtitulo">
        Argentina 2026-27
      </div>

    </div>

  </div>

</header>

<main>

  <div class="kpi-dashboard">

  <div class="kpi-card">
    <span class="kpi-valor">162</span>
    <span class="kpi-label">AOI</span>
  </div>

  <div class="kpi-card">
    <span class="kpi-valor">38%</span>
    <span class="kpi-label">Sown</span>
  </div>

  <div class="kpi-card">
    <span class="kpi-valor">101</span>
    <span class="kpi-label">Pending</span>
  </div>

  <div class="kpi-card">
    <span class="kpi-valor">2</span>
    <span class="kpi-label">Drop</span>
  </div>

</div>
  
  <div class="modulos">

    <div class="card">

      <div class="icono icono-master" aria-hidden="true">
  <span class="icono-linea"></span>
  <span class="icono-linea"></span>
  <span class="icono-linea"></span>
</div>

      <h2>Master List</h2>

      <p>
        AOI, Trials, Access, Photos y Navigation.
      </p>

      <a
        class="boton"
        href="index.html">
        Open Module
      </a>

    </div>

    <div class="card">

      <div class="icono icono-sowing" aria-hidden="true">
  <span class="tallo"></span>
  <span class="hoja hoja-izquierda"></span>
  <span class="hoja hoja-derecha"></span>
</div>

      <h2>Sowing</h2>

      <p>
        Planting Tracker, KPIs, Timeline y Dashboard.
      </p>
<div class="mini-kpi">

  <div class="mini-kpi-valor">
    38%
  </div>

  <div class="mini-kpi-label">
    Planting Progress
  </div>

</div>

<div class="mini-progress">

  <div
    class="mini-progress-fill"
    style="width:38%;">
  </div>

</div>
     <a
  class="boton"
  href="planting/">
  Open Module
</a>

    </div>

    <div class="card">

     <div class="icono icono-harvesting" aria-hidden="true">
  <span class="espiga-tallo"></span>
  <span class="grano grano-1"></span>
  <span class="grano grano-2"></span>
  <span class="grano grano-3"></span>
  <span class="grano grano-4"></span>
</div>

      <h2>Harvesting</h2>

      <p>
        Future module.
      </p>

      <a
class="boton disabled"
href="#">
Coming Soon
</a>

    </div>

  </div>

</main>

</body>
</html>
