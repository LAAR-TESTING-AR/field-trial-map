<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Field Trial Platform</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7f6;
}

header{
  background:#0b6b3a;
  color:white;
  padding:20px;
}

.header-container{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:20px;
}

.logo{
  width:70px;
  height:70px;
}

h1{
  margin:0;
}

.subtitulo{
  margin-top:5px;
}

main{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.modulos{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:25px;
}

.card{
  background:white;
  border-radius:16px;
  padding:25px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.card h2{
  color:#0b6b3a;
}

.icono{
  font-size:48px;
}

.boton{
  display:inline-block;
  margin-top:20px;
  padding:12px 20px;
  background:#0b6b3a;
  color:white;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
}

.disabled{
  background:#999;
  pointer-events:none;
}

@media(max-width:700px){

  .header-container{
    flex-direction:column;
    text-align:center;
  }

}

</style>

</head>

<body>

<header>

  <div class="header-container">

    icon-192.png

    <div>

      <h1>Field Trial Platform</h1>

      <div class="subtitulo">
        Argentina 2026-27
      </div>

    </div>

  </div>

</header>

<main>

  <div class="modulos">

    <div class="card">

      <div class="icono">🗺️</div>

      <h2>Master List</h2>

      <p>
        AOI, Trials, Access, Photos y Navigation.
      </p>

      <a
        class="boton"
        href="index.html">
        Open Module
      </a>

    </div>

    <div class="card">

      <div class="icono">🌱</div>

      <h2>Sowing</h2>

      <p>
        Planting Tracker, KPIs, Timeline y Dashboard.
      </p>

      planting/
        Open Module
      </a>

    </div>

    <div class="card">

      <div class="icono">🌾</div>

      <h2>Harvesting</h2>

      <p>
        Future module.
      </p>

      #
        Coming Soon
      </a>

    </div>

  </div>

</main>

</body>
</html>
