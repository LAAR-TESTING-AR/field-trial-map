<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planting Tracker</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="planting.css">
</head>

<body>

    <header>
<a
  href="../platform.html"
  class="btn-dashboard"
  title="Dashboard">

  <svg
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    xmlns="http://www.w3.org/2000/svg">

    <path
      d="M3 10.5L12 3L21 10.5"
      stroke="white"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <path
      d="M5 9.5V20H19V9.5"
      stroke="white"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"/>

  </svg>

</a>
  <div class="header-container">

    <img
      src="../icon-192.png"
      alt="Field Trial Platform"
      class="logo">

    <div>

      <h1>Field Trial Platform</h1>
<div class="subtitulo">
  Argentina 2026-27
</div>
      <div class="submodulo">
        Module 02 · Sowing
      </div><div class="subtitulo">

    </div>

  </div>

</header>



<div id="contenido">

    <aside id="panelLateral">
<input
    type="search"
    id="busqueda"
    placeholder="Buscar cualquier dato..."
    aria-label="Buscar por cualquier dato del sitio"
    autocomplete="off"
>

       <div id="contenedorFiltros">

    <select id="filtroCrop">
        <option value="">Todos los cultivos</option>
    </select>

    <select id="filtroSeason">
        <option value="">Todas las seasons</option>
    </select>

    <select id="filtroLaar">
        <option value="">Todos los LAAR Status</option>
    </select>

    <select id="filtroOperation">
        <option value="">Todas las operaciones</option>
    </select>

</div>

       
<button id="limpiarFiltros">
    Limpiar filtros
</button>

        <section id="dashboard">

   <div class="dashboard-header">

    <div class="dashboard-titulo">
        Avance de Siembra
    </div>

    <div id="estadoSincronizacion">
        ✅ Sync
    </div>

</div>

    <div class="dashboard-metricas">

        <div>
            <strong id="totalAOI">0</strong>
            <span>AOI</span>
        </div>

        <div>
            <strong id="sembradas">0</strong>
            <span>Semb</span>
        </div>

        <div>
            <strong id="pendientes">0</strong>
            <span>Pend</span>
        </div>

        <div>
            <strong id="drop">0</strong>
            <span>Drop</span>
        </div>

    </div>

    <div class="fila-avance">

        <div class="barra-progreso">

            <div
                id="barraAvance"
                class="barra-progreso-relleno">
            </div>

        </div>

        <div id="avanceGrande">
            0%
        </div>

    </div>
<button id="btnTimeline">
  <span class="icono-timeline">📈</span>
  Evolución de Siembra
</button>
            
</section>
    </aside>


    <div id="mapa"></div>
<button id="botonLeyenda">
  ⓘ
</button>

<div id="panelLeyenda">

  <h3>Estado de Siembra</h3>

  <div>🟢 Sembrado</div>
  <div>🔴 Pendiente</div>
  <div>⚫ Drop</div>

</div>

    <div id="modalTimeline" class="modal-timeline">

  <div class="modal-timeline-contenido">

    <div class="modal-timeline-header">

      <h3>Evolución de Siembra</h3>

      <button id="cerrarTimeline">
        ✕
      </button>

    </div>
<div class="timeline-layout">

  <div class="timeline-sidebar">

    <div class="timeline-filtro-region">

      <label for="selectorRegionesTimeline">
        Regiones
      </label>
<div id="listaRegionesTimeline">
</div>
      <select
        id="selectorRegionesTimeline"
        multiple
        aria-label="Seleccionar una o más regiones">
      </select>

    
     <small>
Sin selección = Toda la campaña
</small>

    </div>

  </div>

  <div class="timeline-grafico">

    <div id="contenedorGraficoTimeline">

      <canvas id="graficoTimeline"></canvas>

    </div>

  </div>

</div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>   
    <script src="planting-offline.js"></script>
<script src="planting.js"></script>


<div id="modalSiembra" class="modal-siembra">

  <div class="modal-siembra-contenido">

    <h3>Registrar Siembra</h3>

    <label for="modalFechaSiembra">
      Fecha de siembra
    </label>

    <input
      type="date"
      id="modalFechaSiembra">

    <div class="modal-botones">

      <button
        id="btnCancelarSiembra"
        type="button">
        Cancelar
      </button>

      <button
        id="btnGuardarSiembra"
        type="button">
        Guardar
      </button>

    </div>

  </div>

</div>    

<script>
document.addEventListener("DOMContentLoaded", () => {

  if (
    window.FieldTrialAppMode &&
    window.FieldTrialAppMode.isViewer
  ) {

    const boton =
      document.querySelector(".btn-dashboard");

    if (boton) {
      boton.href =
        "../platform.html?mode=viewer";
    }

  }

});
</script>
    
</body>
</html>
